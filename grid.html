<!DOCTYPE html>
<html>
    <head>
        <title>Grid</title>
    </head>
<body style="padding-bottom: 1000px;">
    <div style="display: grid;
    grid-template-columns: 100px 100px;
     margin-bottom: 15px;">
        <div style="background-color: lightblue;">div 1</div>
        <div style="background-color: lightpink;">div 2 <p>text</p></div>
    </div>
    <div style="display: grid;
    grid-template-columns: 100px 100px 200px;
    margin-bottom: 15px;">
        <div style="background-color: lightblue;">div 1</div>
        <div style="background-color: lightpink;">div 2 <p>text</p></div>
        <div style="background-color: lightblue;">div 3</div>
          <div style="background-color: lightpink;">div 2 </div>
    </div>
    <div style="display: grid;
    grid-template-columns: 100px 1fr;
     margin-bottom: 15px;">
        <div style="background-color: lightblue;">div 1</div>
        <div style="background-color: lightpink;">1 fr</div>
    </div>
    <div style="display: grid;
    grid-template-columns: 100px 1fr 2fr;
     margin-bottom: 15px;">
        <div style="background-color: lightblue;">div 1</div>
        <div style="background-color: lightpink;">1 fr</div>
        <div style="background-color: lightblue;">2 fr</div>
    </div>
     <div style="display: grid;
    grid-template-columns: 1fr 1fr 1fr;
     margin-bottom: 15px;
     height: 300px;
     column-gap: 15px;
     row-gap: 30px;">
        <div style="background-color: lightblue;">1 fr</div>
        <div style="background-color: lightpink;">1 fr</div>
        <div style="background-color: lightblue;">1 fr</div>
        <div style="background-color: lightpink;">1 fr</div>
        <div style="background-color: lightblue;">1 fr</div>
        <div style="background-color: lightpink;">1 fr</div>
        <div style="background-color: lightblue;">1 fr</div>
    </div>
</body>
</html>
